name: Refresh project stats
on:
  workflow_dispatch:
  schedule:
    # Sundays 04:00 UTC, a quiet window for the GitHub API
    - cron: "0 4 * * 0"
permissions:
  contents: write
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm stats:refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit snapshot
        id: commit
        run: |
          if git diff --quiet -- app/data/project-stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/project-stats.json
          git commit -m "chore(projects): refresh stats snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
